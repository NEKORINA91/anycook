<!DOCTYPE html>
<html lang="en">
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.
    The value is replaced by the `--base-href` argument of `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="AnyCook: recipes that fit the kitchen you actually have.">
  <meta name="theme-color" content="#FCFAF7">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="AnyCook">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>AnyCook</title>
  <link rel="manifest" href="manifest.json">

  <!-- Loading screen: shown instantly, removed when Flutter draws its first frame -->
  <style>
    html, body { margin: 0; height: 100%; background: #FCFAF7; }
    #splash {
      position: fixed; inset: 0; z-index: 9999;
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px;
      background:
        radial-gradient(30rem 22rem at 78% 25%, #F3E8FF 0%, rgba(243,232,255,0) 70%),
        radial-gradient(28rem 22rem at 15% 75%, #FFE4D2 0%, rgba(255,228,210,0) 70%),
        #FCFAF7;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      color: #1C1917;
      transition: opacity 350ms ease;
    }
    #splash.hide { opacity: 0; pointer-events: none; }
    #splash .logo { display: flex; align-items: center; gap: 12px; font-size: 26px; font-weight: 600; letter-spacing: -0.02em; }
    #splash .mark {
      width: 44px; height: 44px; border-radius: 14px; background: #C2410C;
      display: flex; align-items: center; justify-content: center;
      animation: bob 1.6s ease-in-out infinite;
    }
    #splash .track { width: 160px; height: 4px; border-radius: 2px; background: #EEE8E1; overflow: hidden; }
    #splash .bar {
      width: 40%; height: 100%; border-radius: 2px;
      background: linear-gradient(90deg, #F26B1D, #C2410C);
      animation: slide 1.1s ease-in-out infinite;
    }
    #splash .hint { font-size: 13px; color: #6B635C; }
    @keyframes slide { 0% { transform: translateX(-100%); } 100% { transform: translateX(250%); } }
    @keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }
    @media (prefers-reduced-motion: reduce) {
      #splash .mark, #splash .bar { animation: none; }
      #splash .bar { width: 100%; }
    }
  </style>
</head>
<body>
  <div id="splash" role="status" aria-live="polite">
    <div class="logo">
      <span class="mark" aria-hidden="true">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round">
          <path d="M4 11h16a8 8 0 0 1-16 0z"/><path d="M9 7c0-1.5 1-2 1-3.5M14 7c0-1.5 1-2 1-3.5"/>
        </svg>
      </span>
      AnyCook
    </div>
    <div class="track" aria-hidden="true"><div class="bar"></div></div>
    <div class="hint">Warming up the kitchen…</div>
  </div>

  <script>
    window.addEventListener('flutter-first-frame', function () {
      var splash = document.getElementById('splash');
      if (!splash) return;
      splash.classList.add('hide');
      setTimeout(function () { splash.remove(); }, 400);
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
