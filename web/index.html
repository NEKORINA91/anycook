<!DOCTYPE html>
<html lang="en">
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.
    The value is replaced by the `--base-href` argument of `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="AnyCook: recipes that fit the kitchen you actually have.">
  <meta name="theme-color" content="#FCFAF7">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="AnyCook">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>AnyCook</title>
  <link rel="manifest" href="manifest.json">

  <!-- Loading screen: shown instantly, removed when Flutter draws its first frame -->
  <style>
    html, body { margin: 0; height: 100%; background: #FCFAF7; }
    #splash {
      position: fixed; inset: 0; z-index: 9999;
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px;
      background:
        radial-gradient(30rem 22rem at 78% 25%, #F3E8FF 0%, rgba(243,232,255,0) 70%),
        radial-gradient(28rem 22rem at 15% 75%, #FFE4D2 0%, rgba(255,228,210,0) 70%),
        #FCFAF7;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      color: #1C1917;
      transition: opacity 350ms ease;
    }
    #splash.hide { opacity: 0; pointer-events: none; }
    #splash .logo { display: flex; align-items: center; gap: 12px; font-size: 26px; font-weight: 600; letter-spacing: -0.02em; }
    #splash .mark {
      width: 44px; height: 44px; border-radius: 14px; background: #C2410C;
      display: flex; align-items: center; justify-content: center;
      animation: bob 1.6s ease-in-out infinite;
    }
    #splash .hint { font-size: 13px; color: #6B635C; min-height: 1em; transition: opacity 300ms ease; }

    /* Tossing pan */
    #splash .pan-svg { width: 132px; height: 96px; overflow: visible; }
    #splash .pan, #splash .food, #splash .steam { transform-box: fill-box; }
    #splash .pan { transform-origin: 30% 50%; animation: toss 1.3s cubic-bezier(.45,.05,.35,1) infinite; }
    #splash .food { transform-origin: center; animation: flip 1.3s cubic-bezier(.3,.6,.4,1) infinite; }
    #splash .food.f2 { animation-delay: .08s; }
    #splash .food.f3 { animation-delay: .16s; }
    #splash .steam { opacity: 0; animation: steam 2.6s ease-out infinite; }
    #splash .steam.s2 { animation-delay: 1.3s; }
    @keyframes toss {
      0%, 100% { transform: rotate(0deg); }
      18% { transform: rotate(-11deg); }
      34% { transform: rotate(5deg); }
      55% { transform: rotate(0deg); }
    }
    @keyframes flip {
      0%, 14% { transform: translateY(0) rotate(0deg); }
      42% { transform: translateY(-34px) rotate(180deg); }
      64%, 100% { transform: translateY(0) rotate(360deg); }
    }
    @keyframes steam {
      0% { opacity: 0; transform: translateY(6px); }
      30% { opacity: .55; }
      100% { opacity: 0; transform: translateY(-18px); }
    }
    @keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }
    @media (prefers-reduced-motion: reduce) {
      #splash .mark, #splash .pan, #splash .food, #splash .steam { animation: none; }
    }
  </style>
</head>
<body>
  <div id="splash" role="status" aria-live="polite">
    <div class="logo">
      <span class="mark" aria-hidden="true">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round">
          <path d="M4 11h16a8 8 0 0 1-16 0z"/><path d="M9 7c0-1.5 1-2 1-3.5M14 7c0-1.5 1-2 1-3.5"/>
        </svg>
      </span>
      AnyCook
    </div>
    <svg class="pan-svg" viewBox="0 0 132 96" aria-hidden="true">
      <!-- steam -->
      <path class="steam" d="M52 30c-4-5 4-8 0-14" fill="none" stroke="#D6CEC5" stroke-width="3" stroke-linecap="round"/>
      <path class="steam s2" d="M68 28c-4-5 4-8 0-14" fill="none" stroke="#D6CEC5" stroke-width="3" stroke-linecap="round"/>
      <g class="pan">
        <!-- food -->
        <g class="food f1"><ellipse cx="46" cy="58" rx="8" ry="6" fill="#FFFFFF" stroke="#EEE8E1"/><circle cx="46" cy="58" r="3.4" fill="#F6B73C"/></g>
        <circle class="food f2" cx="60" cy="58" r="4.5" fill="#7DB46C"/>
        <rect class="food f3" x="68" y="54" width="10" height="7" rx="3.5" fill="#F26B1D"/>
        <!-- pan -->
        <path d="M26 62h64a4 4 0 0 1-4 5c-10 9-46 9-56 0a4 4 0 0 1-4-5z" fill="#1C1917"/>
        <rect x="88" y="60" width="34" height="6" rx="3" fill="#C2410C"/>
      </g>
    </svg>
    <div class="hint" id="splash-hint">Warming up the kitchen…</div>
  </div>

  <script>
    // If loading is slow, change the message so it doesn't feel stuck.
    var slowTimer = setTimeout(function () {
      var hint = document.getElementById('splash-hint');
      if (hint) hint.textContent = 'Almost ready, plating up…';
    }, 4000);
    window.addEventListener('flutter-first-frame', function () {
      clearTimeout(slowTimer);
      var splash = document.getElementById('splash');
      if (!splash) return;
      splash.classList.add('hide');
      setTimeout(function () { splash.remove(); }, 400);
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
